---
# Bootstrap and hardening phase
# Initial connection happens as root because Terraform
# already injected the CM SSH public key into root user.

- name: Bootstrap and harden all servers
  hosts: all
  become: true
  roles:
    - common

- name: Configure Nginx backend
  hosts: nginx
  become: true
  roles:
    - nginx

- name: Configure Apache backend
  hosts: apache
  become: true
  roles:
    - apache

- name: Configure HAProxy load balancer
  hosts: haproxy
  become: true
  roles:
    - haproxy